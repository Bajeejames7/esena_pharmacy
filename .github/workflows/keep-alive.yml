name: Keep backend and database warm

# Render's free tier sleeps a web service after ~15 minutes of no traffic,
# and Aiven's free database can idle-pause too. Hitting a DB-touching
# endpoint every 10 minutes keeps both alive — well under Render's
# threshold, with margin for GitHub Actions' own scheduling jitter.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping a DB-touching endpoint
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" https://api.esena.co.ke/api/products)
          echo "HTTP status: $status"
          cat /tmp/response.json
          if [ "$status" -ge 500 ]; then
            echo "::error::Backend/database returned $status"
            exit 1
          fi
